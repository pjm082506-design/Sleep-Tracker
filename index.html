<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zzz Tracker Pro</title>
    
    <!-- iPhone Full Screen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <!-- Links to our separate styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Zzz Tracker</h1>

    <!-- 📊 VISUAL CHART DISPLAY -->
    <div class="dashboard">
        <div class="stat-label">Weekly Average</div>
        <div class="stat-value" id="avg-sleep-display">0h 0m</div>
        
        <div class="chart-container">
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-6"></div><div class="chart-label" id="lbl-6">-</div></div>
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-5"></div><div class="chart-label" id="lbl-5">-</div></div>
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-4"></div><div class="chart-label" id="lbl-4">-</div></div>
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-3"></div><div class="chart-label" id="lbl-3">-</div></div>
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-2"></div><div class="chart-label" id="lbl-2">-</div></div>
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-1"></div><div class="chart-label" id="lbl-1">-</div></div>
            <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-0"></div><div class="chart-label" id="lbl-0">Latest</div></div>
        </div>
    </div>

    <!-- ⏱️ TIMER SYSTEM -->
    <div class="status" id="status-text">Ready for bed?</div>
    <div class="timer-display" id="timer">00:00:00</div>
    <button id="main-btn" onclick="toggleSleep()">Going to Sleep</button>

    <!-- 🗒️ LOG HISTORY -->
    <div class="history-container">
        <div class="history-header">
            <span>Sleep Log</span>
            <button class="clear-btn" onclick="clearHistory()">Clear All</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
    </div>

    <!-- Links to our separate math logic -->
    <script src="script.js"></script>
</body>
</html>
